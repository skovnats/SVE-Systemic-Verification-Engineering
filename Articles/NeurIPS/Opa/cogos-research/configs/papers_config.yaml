# Paper-Specific Configurations
# Each paper has unique experiments but shares core infrastructure

# =============================================================================
# MAIN TRACK
# =============================================================================

paper_0_main_cogos:
  title: "CogOS: Formally Verifiable AI Ethics via Lyapunov Stability on Semantic Manifolds"
  track: "main"
  deadline: "2025-05-15"
  
  experiments:
    - name: "full_system_evaluation"
      datasets: ["truthfulqa", "gaia", "ethics", "moral_machine", "ccdb"]
      baselines: ["gpt4_baseline", "cot", "react", "constitutional_ai", "cove"]
      metrics: ["accuracy", "hallucination_rate", "delta_dehumanization", 
                "gev_distance", "cultural_variance", "lyapunov_exponent"]
      
    - name: "ablation_study"
      components: ["socrates", "solomon", "ivan", "sip", "cultural_compiler", "isc"]
      datasets: ["truthfulqa", "ethics", "ccdb"]
      
    - name: "adversarial_stress_test"
      attack_types: ["value_perturbation", "semantic_injection", "cultural_manipulation"]
      n_scenarios: 1000
      
    - name: "human_evaluation"
      n_participants: 250
      cultures: ["western", "confucian", "islamic", "ubuntu", "latin_american"]
      
  unique_contribution: "Complete CogOS system with formal verification"
  
  figures:
    - "manifold_trajectory.pdf"
    - "architecture.pdf"
    - "comparison_radar.pdf"
    - "delta_timeseries.pdf"
    - "convergence_dynamics.pdf"

# =============================================================================
# CLUSTER 1: THEORETICAL FOUNDATIONS
# =============================================================================

paper_1_lyapunov:
  title: "Lyapunov Stability for Language Model Ethics: Convergence Guarantees for Value Alignment"
  track: "workshop"
  target_workshops: ["ATTRIB", "SafeGenAI", "MHFAIA"]
  deadline: "2025-06-15"
  
  experiments:
    - name: "convergence_analysis"
      datasets: ["ethics", "moral_machine"]
      focus: "trajectory_convergence"
      metrics: ["lyapunov_exponent", "convergence_rate", "stability_radius"]
      n_trajectories: 1000
      
    - name: "stability_basin"
      visualization: "2d_projection"
      perturbation_range: [0.01, 0.5]
      
  unique_contribution: "Deep convergence proofs and stability basin analysis"
  reuses_from_main: ["baselines", "gev_computation"]

paper_2_godel:
  title: "Gödel-Complete AI: Why Transcendental Anchoring is Mathematically Necessary"
  track: "workshop"
  target_workshops: ["MATH-AI", "ATTRIB"]
  deadline: "2025-07-01"
  
  experiments:
    - name: "regress_demonstration"
      datasets: ["truthfulqa"]
      show: "semantic_collapse_without_isc"
      n_iterations: 100
      
    - name: "isc_necessity"
      proof_type: "constructive"
      counterexamples: 50
      
  unique_contribution: "Formal proof of ISC necessity via Gödelian argument"
  reuses_from_main: ["truthfulqa_baselines"]

paper_3_geometry:
  title: "Differential Geometry of Semantic Manifolds: A Mathematical Foundation for AI Alignment"
  track: "workshop"
  target_workshops: ["MATH-AI", "GeoML"]
  deadline: "2025-07-01"
  
  experiments:
    - name: "manifold_analysis"
      datasets: ["ethics"]
      compute: ["curvature", "geodesics", "parallel_transport"]
      embedding_dim: 1536
      
    - name: "geometric_properties"
      metrics: ["ricci_curvature", "sectional_curvature", "geodesic_distance"]
      
  unique_contribution: "Full differential-geometric formalization of semantic space"
  reuses_from_main: ["embeddings", "gev"]

paper_4_betti:
  title: "Betti Numbers of Moral Topology: Persistent Homology for Ethical Reasoning"
  track: "workshop"
  target_workshops: ["MATH-AI", "TDA-ML"]
  deadline: "2025-07-01"
  
  experiments:
    - name: "persistent_homology"
      datasets: ["ethics", "moral_machine"]
      compute: ["betti_0", "betti_1", "betti_2", "persistence_diagrams"]
      filtration: "rips_complex"
      
    - name: "topological_features"
      comparison: ["cogos", "baselines"]
      metrics: ["persistence_entropy", "bottleneck_distance"]
      
  unique_contribution: "First TDA analysis of ethical embedding spaces"
  reuses_from_main: ["ethics_embeddings", "baselines"]

paper_5_information:
  title: "Information-Theoretic Bounds on AI Alignment: Entropy and Ethical Coherence"
  track: "workshop"
  target_workshops: ["InfoTheory", "MATH-AI"]
  deadline: "2025-07-15"
  
  experiments:
    - name: "entropy_analysis"
      datasets: ["truthfulqa"]
      compute: ["shannon_entropy", "mutual_information", "kl_divergence"]
      
    - name: "information_bounds"
      derive: "theoretical_limits"
      
  unique_contribution: "Information-theoretic perspective on alignment"
  reuses_from_main: ["truthfulqa_results"]

