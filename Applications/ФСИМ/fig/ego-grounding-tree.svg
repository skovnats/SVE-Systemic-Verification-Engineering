<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .label { font-size: 11px; font-style: italic; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Root: Ego -->
  <rect x="240" y="20" width="200" height="50" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text class="th" x="340" y="42" text-anchor="middle" fill="#2C2C2A">Эго (Заземление)</text>
  <text class="ts" x="340" y="58" text-anchor="middle">На чём замкнут?</text>

  <!-- Branch left: Not transcendent -->
  <line x1="280" y1="72" x2="140" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text class="label" x="195" y="86" fill="#5F5E5A">Опция 2</text>

  <!-- Branch right: Transcendent -->
  <line x1="400" y1="72" x2="500" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text class="label" x="460" y="86" fill="#5F5E5A">Опция 1</text>

  <!-- Option 2: Material -->
  <rect x="40" y="112" width="200" height="70" rx="10" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text class="th" x="140" y="132" text-anchor="middle" fill="#791F1F">Материальное</text>
  <text class="ts" x="140" y="150" text-anchor="middle" fill="#A32D2D">Эго = зеркало Матрицы</text>
  <text class="ts" x="140" y="166" text-anchor="middle" fill="#A32D2D">стимул-реакция · ДНК</text>

  <!-- Arrow down from Option 2 -->
  <line x1="140" y1="184" x2="140" y2="220" stroke="#A32D2D" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Conclusion: Matrix -->
  <rect x="50" y="222" width="180" height="44" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
  <text class="th" x="140" y="240" text-anchor="middle" fill="#791F1F">КОНЕЧНАЯ → Матрица</text>
  <text class="ts" x="140" y="256" text-anchor="middle" fill="#A32D2D">уязвима по Гёделю</text>

  <!-- Option 1: Transcendent -->
  <rect x="400" y="112" width="240" height="50" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="520" y="132" text-anchor="middle" fill="#3C3489">Трансцендентное</text>
  <text class="ts" x="520" y="150" text-anchor="middle" fill="#534AB7">За пределами материи</text>

  <!-- Sub-branch: NOT God -->
  <line x1="470" y1="164" x2="370" y2="210" stroke="#888780" stroke-width="0.8" marker-end="url(#arr)"/>
  <text class="label" x="405" y="182" fill="#854F0B">НЕ Бог</text>

  <!-- Sub-branch: God -->
  <line x1="570" y1="164" x2="600" y2="210" stroke="#888780" stroke-width="0.8" marker-end="url(#arr)"/>
  <text class="label" x="598" y="182" fill="#085041">Бог</text>

  <!-- Option 1a: NOT God transcendent -->
  <rect x="270" y="212" width="210" height="76" rx="10" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <text class="th" x="375" y="232" text-anchor="middle" fill="#633806">«НЕ-Бог»</text>
  <text class="ts" x="375" y="250" text-anchor="middle" fill="#854F0B">Эзотерика, оккультизм,</text>
  <text class="ts" x="375" y="266" text-anchor="middle" fill="#854F0B">сверх-интеллект</text>
  <text class="ts" x="375" y="282" text-anchor="middle" fill="#854F0B">НЕ ∞ → конечная</text>

  <!-- Arrow down from 1a -->
  <line x1="375" y1="290" x2="375" y2="326" stroke="#854F0B" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Conclusion 1a -->
  <rect x="285" y="328" width="180" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
  <text class="th" x="375" y="348" text-anchor="middle" fill="#633806">КОНЕЧНАЯ → Матрица</text>
  <text class="ts" x="375" y="364" text-anchor="middle" fill="#854F0B">сложнее, но уязвима</text>
  <text class="ts" x="375" y="378" text-anchor="middle" fill="#854F0B">«вампир» (паразит)</text>

  <!-- Option 1b: God -->
  <rect x="520" y="212" width="150" height="76" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="th" x="595" y="234" text-anchor="middle" fill="#085041">Бог</text>
  <text class="ts" x="595" y="252" text-anchor="middle" fill="#0F6E56">∞ → Бесконечность</text>
  <text class="ts" x="595" y="268" text-anchor="middle" fill="#0F6E56">Открытая система</text>
  <text class="ts" x="595" y="284" text-anchor="middle" fill="#0F6E56">Аксиома 1</text>

  <!-- Arrow down from 1b -->
  <line x1="595" y1="290" x2="595" y2="326" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Conclusion 1b -->
  <rect x="510" y="328" width="170" height="60" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
  <text class="th" x="595" y="348" text-anchor="middle" fill="#085041">БЕСКОНЕЧНАЯ</text>
  <text class="ts" x="595" y="364" text-anchor="middle" fill="#0F6E56">Неберущаяся</text>
  <text class="ts" x="595" y="378" text-anchor="middle" fill="#0F6E56">единственный выход</text>

  <!-- Star on 1b -->
  <polygon points="595,310 598,318 607,318 600,323 603,332 595,327 587,332 590,323 583,318 592,318" fill="#5DCAA5" opacity="0.5"/>

  <!-- FSIM arrows hitting Matrix boxes -->
  <rect x="50" y="288" width="180" height="28" rx="6" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text class="ts" x="140" y="306" text-anchor="middle" fill="#534AB7">∃ ФСИМ → схлопывание</text>

  <rect x="285" y="398" width="180" height="28" rx="6" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text class="ts" x="375" y="416" text-anchor="middle" fill="#534AB7">∃ ФСИМ → схлопывание</text>

  <!-- Room 101 annotation -->
  <rect x="100" y="440" width="480" height="56" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="340" y="462" text-anchor="middle" fill="#3C3489">«Комната 101» (Оруэлл) ↔ ФСИМ</text>
  <text class="ts" x="340" y="480" text-anchor="middle" fill="#534AB7">Система ломает Человека через его страх · ФСИМ ломает Систему через её противоречия</text>
</svg>
