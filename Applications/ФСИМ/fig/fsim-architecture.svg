<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
    .sub { font-size: 11px; fill: #5F5E5A; }
    .label { font-size: 10px; fill: #5F5E5A; font-style: italic; }
  </style>
  
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background groups -->
  
  <!-- Axioms layer (top) -->
  <rect x="20" y="20" width="760" height="60" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="title" x="400" y="42" text-anchor="middle" fill="#3C3489">Аксиоматика</text>
  <text class="sub" x="400" y="60" text-anchor="middle" fill="#534AB7">А0: Только своя жизнь · А1: Бог — Источник · А2: Христос — Путь · А3: Квантовая сложность</text>

  <!-- FSIM core (center) -->
  <rect x="240" y="110" width="320" height="100" rx="16" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="title" x="400" y="140" text-anchor="middle" fill="#085041">ФСИМ</text>
  <text class="sub" x="400" y="158" text-anchor="middle" fill="#0F6E56">Фрактальная Смысло-Интеллектуальная Матрёшка</text>
  <text class="sub" x="400" y="176" text-anchor="middle" fill="#0F6E56">Замкнута на Авторе + Предельная Искренность</text>

  <!-- SVE (left) -->
  <rect x="30" y="250" width="200" height="90" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="title" x="130" y="278" text-anchor="middle" fill="#0C447C">SVE</text>
  <text class="sub" x="130" y="296" text-anchor="middle" fill="#185FA5">git-интерфейс</text>
  <text class="sub" x="130" y="312" text-anchor="middle" fill="#185FA5">для онтологий</text>

  <!-- Matritsa (right) -->
  <rect x="570" y="250" width="200" height="90" rx="12" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text class="title" x="670" y="278" text-anchor="middle" fill="#791F1F">«Матрица»</text>
  <text class="sub" x="670" y="296" text-anchor="middle" fill="#A32D2D">Закрытая онтология</text>
  <text class="sub" x="670" y="312" text-anchor="middle" fill="#A32D2D">с противоречиями</text>

  <!-- Lestnitsa (center bottom) -->
  <rect x="270" y="250" width="260" height="90" rx="12" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <text class="title" x="400" y="278" text-anchor="middle" fill="#633806">Лестница Иакова</text>
  <text class="sub" x="400" y="296" text-anchor="middle" fill="#854F0B">Иерархия ФСИМ-Онтологий-n</text>
  <text class="sub" x="400" y="312" text-anchor="middle" fill="#854F0B">P2P-сеть · BFT-консенсус</text>

  <!-- Bottom: Applications -->
  <rect x="30" y="380" width="155" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="title" x="107" y="405" text-anchor="middle" fill="#2C2C2A">Когнитивная</text>
  <text class="sub" x="107" y="422" text-anchor="middle">безопасность</text>

  <rect x="210" y="380" width="155" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="title" x="287" y="405" text-anchor="middle" fill="#2C2C2A">Безопасность</text>
  <text class="sub" x="287" y="422" text-anchor="middle">ИИ (Alignment)</text>

  <rect x="390" y="380" width="155" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="title" x="467" y="405" text-anchor="middle" fill="#2C2C2A">Психология</text>
  <text class="sub" x="467" y="422" text-anchor="middle">IFS + SVE</text>

  <rect x="570" y="380" width="200" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="title" x="670" y="405" text-anchor="middle" fill="#2C2C2A">Асимметричный</text>
  <text class="sub" x="670" y="422" text-anchor="middle">аудит реальности</text>

  <!-- Arrows -->
  <!-- Axioms → FSIM -->
  <line x1="400" y1="80" x2="400" y2="108" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)" opacity="0.6"/>
  
  <!-- FSIM → SVE -->
  <path d="M280 210 L150 248" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>
  <text class="label" x="195" y="222">верификация</text>
  
  <!-- FSIM → Matritsa -->
  <path d="M520 210 L640 248" fill="none" stroke="#A32D2D" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>
  <text class="label" x="560" y="222">схлопывание</text>

  <!-- FSIM → Lestnitsa -->
  <line x1="400" y1="210" x2="400" y2="248" stroke="#854F0B" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>

  <!-- Bottom arrows from Lestnitsa -->
  <line x1="310" y1="340" x2="150" y2="378" stroke="#888780" stroke-width="0.8" marker-end="url(#arr)" opacity="0.4"/>
  <line x1="370" y1="340" x2="310" y2="378" stroke="#888780" stroke-width="0.8" marker-end="url(#arr)" opacity="0.4"/>
  <line x1="430" y1="340" x2="467" y2="378" stroke="#888780" stroke-width="0.8" marker-end="url(#arr)" opacity="0.4"/>
  <line x1="490" y1="340" x2="630" y2="378" stroke="#888780" stroke-width="0.8" marker-end="url(#arr)" opacity="0.4"/>

  <!-- Self-reference loop on FSIM -->
  <path d="M560 140 C600 120, 600 200, 560 180" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text class="label" x="608" y="155" fill="#0F6E56">самореференция</text>

  <!-- Math tools label -->
  <text class="label" x="400" y="478" text-anchor="middle">Гёдель · Колмогоров · Брауэр · Том · No-Cloning · ZKP · BFT · Halting Problem</text>
</svg>
