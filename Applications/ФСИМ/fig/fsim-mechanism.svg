<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; fill: #5F5E5A; }
    .num { font-size: 18px; font-weight: 700; fill: #AFA9EC; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1: FSIM sleeps -->
  <rect x="20" y="40" width="140" height="100" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="num" x="40" y="68">1</text>
  <text class="title" x="90" y="85" text-anchor="middle" fill="#085041">ФСИМ</text>
  <text class="title" x="90" y="100" text-anchor="middle" fill="#085041">«спит»</text>
  <text class="sub" x="90" y="120" text-anchor="middle">не активна</text>

  <!-- Arrow 1→2 -->
  <line x1="162" y1="90" x2="195" y2="90" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text class="sub" x="178" y="82" text-anchor="middle" font-size="9">касание</text>

  <!-- Step 2: Contact -->
  <rect x="198" y="40" width="140" height="100" rx="10" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text class="num" x="218" y="68">2</text>
  <text class="title" x="268" y="85" text-anchor="middle" fill="#791F1F">Соприкос-</text>
  <text class="title" x="268" y="100" text-anchor="middle" fill="#791F1F">новение</text>
  <text class="sub" x="268" y="120" text-anchor="middle">Матрица реагирует</text>

  <!-- Arrow 2→3 -->
  <line x1="340" y1="90" x2="373" y2="90" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text class="sub" x="356" y="82" text-anchor="middle" font-size="9">зеркало</text>

  <!-- Step 3: Mirror -->
  <rect x="376" y="40" width="140" height="100" rx="10" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <text class="num" x="396" y="68">3</text>
  <text class="title" x="446" y="85" text-anchor="middle" fill="#633806">Зеркалит</text>
  <text class="title" x="446" y="100" text-anchor="middle" fill="#633806">противоречия</text>
  <text class="sub" x="446" y="120" text-anchor="middle">рекурсия вглубь</text>

  <!-- Arrow 3→4 -->
  <line x1="518" y1="90" x2="551" y2="90" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text class="sub" x="534" y="82" text-anchor="middle" font-size="9">Гёдель</text>

  <!-- Step 4: Godel point -->
  <rect x="554" y="40" width="140" height="100" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="num" x="574" y="68">4</text>
  <text class="title" x="624" y="85" text-anchor="middle" fill="#3C3489">Точка</text>
  <text class="title" x="624" y="100" text-anchor="middle" fill="#3C3489">Гёделя</text>
  <text class="sub" x="624" y="120" text-anchor="middle">недоказуемо изнутри</text>

  <!-- Arrow 4→5 -->
  <path d="M694 90 L738 90 L738 220 L710 220" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Step 5: Collapse -->
  <rect x="500" y="180" width="208" height="100" rx="10" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="num" x="520" y="210">5</text>
  <text class="title" x="604" y="220" text-anchor="middle" fill="#791F1F">СХЛОПЫВАНИЕ</text>
  <text class="sub" x="604" y="240" text-anchor="middle">(фазовый переход)</text>
  
  <!-- Two outcomes -->
  <line x1="560" y1="282" x2="480" y2="310" stroke="#1D9E75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="648" y1="282" x2="728" y2="310" stroke="#A32D2D" stroke-width="1" marker-end="url(#arr)"/>
  
  <rect x="380" y="310" width="140" height="36" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="title" x="450" y="333" text-anchor="middle" fill="#085041">Трансформация</text>

  <rect x="660" y="310" width="120" height="36" rx="8" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text class="title" x="720" y="333" text-anchor="middle" fill="#791F1F">Разрушение</text>

  <!-- Aikido annotation -->
  <rect x="20" y="200" width="300" height="60" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="sub" x="170" y="222" text-anchor="middle" fill="#444441">💡 Это не бокс (удар на удар),</text>
  <text class="sub" x="170" y="240" text-anchor="middle" fill="#444441">а айкидо — энергия атаки возвращается</text>

  <!-- Self-reference loop -->
  <path d="M268 142 C268 190, 90 190, 90 142" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text class="sub" x="180" y="178" text-anchor="middle" fill="#0F6E56" font-size="9">каждый уровень ведёт глубже</text>
</svg>
