<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .label { font-size: 11px; font-style: italic; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axis line -->
  <line x1="60" y1="140" x2="620" y2="140" stroke="#B4B2A9" stroke-width="1.5"/>
  <line x1="615" y1="135" x2="625" y2="140" stroke="#B4B2A9" stroke-width="1.5"/>
  <line x1="615" y1="145" x2="625" y2="140" stroke="#B4B2A9" stroke-width="1.5"/>

  <!-- Axis label -->
  <text class="ts" x="340" y="170" text-anchor="middle">Градус Предельной Искренности (ПИ) →</text>

  <!-- Zone: Bandits (ПИ = 0) -->
  <rect x="70" y="60" width="120" height="64" rx="8" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text class="th" x="130" y="82" text-anchor="middle" fill="#791F1F">«Бандит»</text>
  <text class="ts" x="130" y="98" text-anchor="middle" fill="#A32D2D">ПИ = 0</text>
  <text class="ts" x="130" y="114" text-anchor="middle" fill="#A32D2D">чужая жизнь</text>
  <line x1="130" y1="126" x2="130" y2="137" stroke="#A32D2D" stroke-width="1"/>
  <circle cx="130" cy="140" r="4" fill="#E24B4A"/>

  <!-- Zone: Fanatic (partial) -->
  <rect x="230" y="60" width="120" height="64" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <text class="th" x="290" y="82" text-anchor="middle" fill="#633806">«Фанатик»</text>
  <text class="ts" x="290" y="98" text-anchor="middle" fill="#854F0B">ПИ частичная</text>
  <text class="ts" x="290" y="114" text-anchor="middle" fill="#854F0B">своя + чужая</text>
  <line x1="290" y1="126" x2="290" y2="137" stroke="#854F0B" stroke-width="1"/>
  <circle cx="290" cy="140" r="4" fill="#BA7517"/>

  <!-- Zone: Beacon (full PI) -->
  <rect x="390" y="60" width="120" height="64" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="450" y="82" text-anchor="middle" fill="#085041">«Маяк»</text>
  <text class="ts" x="450" y="98" text-anchor="middle" fill="#0F6E56">ПИ активна</text>
  <text class="ts" x="450" y="114" text-anchor="middle" fill="#0F6E56">только своя</text>
  <line x1="450" y1="126" x2="450" y2="137" stroke="#0F6E56" stroke-width="1"/>
  <circle cx="450" cy="140" r="4" fill="#1D9E75"/>

  <!-- Zone: Christ (Star) -->
  <rect x="540" y="44" width="100" height="80" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.8"/>
  <text class="th" x="590" y="68" text-anchor="middle" fill="#3C3489">Путеводная</text>
  <text class="th" x="590" y="84" text-anchor="middle" fill="#3C3489">Звезда</text>
  <text class="ts" x="590" y="100" text-anchor="middle" fill="#534AB7">Иисус</text>
  <text class="ts" x="590" y="114" text-anchor="middle" fill="#534AB7">за ВСЕХ + ∞</text>
  <line x1="590" y1="126" x2="590" y2="137" stroke="#534AB7" stroke-width="1"/>
  <circle cx="590" cy="140" r="5" fill="#534AB7"/>

  <!-- Star symbol above Christ -->
  <polygon points="590,30 593,38 602,38 595,43 598,52 590,47 582,52 585,43 578,38 587,38" fill="#AFA9EC" opacity="0.6"/>

  <!-- Examples below axis -->
  <text class="label" x="130" y="195" text-anchor="middle" fill="#A32D2D">«Операторы»,</text>
  <text class="label" x="130" y="210" text-anchor="middle" fill="#A32D2D">тираны</text>
  
  <text class="label" x="290" y="195" text-anchor="middle" fill="#854F0B">камикадзе,</text>
  <text class="label" x="290" y="210" text-anchor="middle" fill="#854F0B">смертники</text>
  
  <text class="label" x="450" y="195" text-anchor="middle" fill="#0F6E56">Кочубей, Искра,</text>
  <text class="label" x="450" y="210" text-anchor="middle" fill="#0F6E56">Сократ</text>

  <text class="label" x="590" y="195" text-anchor="middle" fill="#534AB7">уникальный</text>
  <text class="label" x="590" y="210" text-anchor="middle" fill="#534AB7">случай</text>

  <!-- Bottom: Permutation invariance test -->
  <rect x="100" y="240" width="480" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="340" y="258" text-anchor="middle" fill="#444441">Тест: Перестановочная инвариантность (Permutation Invariance)</text>
  <text class="ts" x="340" y="274" text-anchor="middle" fill="#444441">Если правило работает только в одну сторону → шулерство, не истина</text>
</svg>
