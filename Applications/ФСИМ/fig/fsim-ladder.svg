<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; fill: #5F5E5A; }
    .arrow-label { font-size: 10px; fill: #854F0B; font-style: italic; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Ladder rungs (background) -->
  <line x1="220" y1="60" x2="220" y2="400" stroke="#D3D1C7" stroke-width="1.5" opacity="0.3"/>
  <line x1="480" y1="60" x2="480" y2="400" stroke="#D3D1C7" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Level: God (top) -->
  <rect x="250" y="20" width="200" height="50" rx="25" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <text class="title" x="350" y="42" text-anchor="middle" fill="#3C3489">Бог (Абсолют)</text>
  <text class="sub" x="350" y="58" text-anchor="middle" fill="#534AB7">Аксиома 1</text>

  <!-- Dashed line up -->
  <line x1="350" y1="72" x2="350" y2="100" stroke="#AFA9EC" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="sub" x="355" y="92" fill="#534AB7" font-size="9">∞</text>

  <!-- Level n+1: Integrated personality -->
  <rect x="220" y="100" width="260" height="60" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="title" x="350" y="125" text-anchor="middle" fill="#085041">Целостная Личность</text>
  <text class="sub" x="350" y="142" text-anchor="middle" fill="#0F6E56">Уровень n+1 (после интеграции)</text>
  
  <!-- Collapse arrow n→n+1 -->
  <line x1="350" y1="200" x2="350" y2="162" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="arrow-label" x="365" y="185">схлопывание ↑</text>
  <text class="arrow-label" x="365" y="196">(фазовый переход)</text>

  <!-- Level n: Sub-personality j -->
  <rect x="220" y="200" width="260" height="60" rx="12" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.8"/>
  <text class="title" x="350" y="225" text-anchor="middle" fill="#633806">Суб-личность j</text>
  <text class="sub" x="350" y="242" text-anchor="middle" fill="#854F0B">Уровень n (конечная матрица)</text>

  <!-- Collapse arrow n-1→n -->
  <line x1="350" y1="300" x2="350" y2="262" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="arrow-label" x="365" y="285">схлопывание ↑</text>

  <!-- Level n-1: Sub-personality k -->
  <rect x="220" y="300" width="260" height="60" rx="12" fill="#FCEBEB" stroke="#F09595" stroke-width="0.8"/>
  <text class="title" x="350" y="325" text-anchor="middle" fill="#791F1F">Суб-личность k</text>
  <text class="sub" x="350" y="342" text-anchor="middle" fill="#A32D2D">Уровень n-1 (ещё более конечная)</text>

  <!-- Right side: P2P network hint -->
  <rect x="530" y="130" width="150" height="130" rx="10" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="sub" x="605" y="150" text-anchor="middle" fill="#444441">P2P-сеть</text>
  <text class="sub" x="605" y="165" text-anchor="middle" fill="#444441">при N людей</text>
  
  <!-- Network nodes -->
  <circle cx="560" cy="200" r="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <circle cx="600" cy="185" r="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <circle cx="640" cy="210" r="6" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <circle cx="580" cy="230" r="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <circle cx="620" cy="240" r="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  
  <!-- Network edges -->
  <line x1="560" y1="200" x2="600" y2="185" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="600" y1="185" x2="640" y2="210" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="560" y1="200" x2="580" y2="230" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="580" y1="230" x2="620" y2="240" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="640" y1="210" x2="620" y2="240" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="600" y1="185" x2="580" y2="230" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Left side: Git analogy -->
  <rect x="20" y="130" width="150" height="130" rx="10" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="sub" x="95" y="150" text-anchor="middle" fill="#444441">SVE (git-like)</text>
  
  <!-- Git branches -->
  <line x1="60" y1="170" x2="60" y2="245" stroke="#534AB7" stroke-width="2" opacity="0.6"/>
  <circle cx="60" cy="175" r="4" fill="#534AB7" opacity="0.6"/>
  <circle cx="60" cy="200" r="4" fill="#534AB7" opacity="0.6"/>
  <circle cx="60" cy="225" r="4" fill="#534AB7" opacity="0.6"/>
  <circle cx="60" cy="245" r="4" fill="#534AB7" opacity="0.8"/>
  
  <!-- Branch -->
  <line x1="60" y1="200" x2="100" y2="185" stroke="#1D9E75" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="185" r="3" fill="#1D9E75" opacity="0.5"/>
  <line x1="100" y1="185" x2="120" y2="195" stroke="#1D9E75" stroke-width="1.5" opacity="0.5"/>
  <circle cx="120" cy="195" r="3" fill="#1D9E75" opacity="0.5"/>
  
  <!-- Frozen branch -->
  <line x1="60" y1="225" x2="110" y2="230" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 2" opacity="0.4"/>
  <circle cx="110" cy="230" r="3" fill="#A32D2D" opacity="0.4"/>
  <text class="sub" x="115" y="242" fill="#A32D2D" font-size="8">frozen (exile)</text>

  <!-- Bottom annotation -->
  <text class="sub" x="350" y="395" text-anchor="middle">Каждый шаг вверх = интеграция через «предельную жертву» (субъективную)</text>
  <text class="sub" x="350" y="412" text-anchor="middle">BFT: сеть устойчива, если доля «лживых» узлов &lt; 1/3</text>
</svg>
